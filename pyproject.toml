[project]
name = "palestra-vendas-demo"
version = "0.1.0"
description = "Demo: agente de vendas (ADK) + plugin de telemetria + dashboard"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk>=2.12.0,<3.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
